name: Build Windows Studio candidate
description: Build the exact commit and verify the Windows installer and update assets.
runs:
  using: composite
  steps:
    - name: Test standard-user acceptance coordinator failure handling
      shell: powershell
      run: ./scripts/test-windows-studio-acceptance-coordinator.ps1
    - name: Test isolated public updater test repository refs
      shell: powershell
      run: ./scripts/test-windows-studio-updater-test-refs.ps1
    - uses: pnpm/action-setup@v4
      with:
        version: 11.19.0
        run_install: false
    - uses: actions/setup-node@v5
      with:
        node-version: 24
        cache: pnpm
    - uses: actions-rust-lang/setup-rust-toolchain@v2
      with:
        toolchain: stable
        target: x86_64-pc-windows-msvc
        components: clippy, rustfmt
        rust-src-dir: tools/ngt-updater
    - name: Test GitHub CLI authentication source precedence
      shell: powershell
      run: ./scripts/run-windows-studio-acceptance-as-standard-user.ps1 -Acceptance production-update -AuthMatrixOnly
    - name: Test and format-check the native updater
      shell: powershell
      run: |
        $env:CARGO_TARGET_DIR = Join-Path $env:RUNNER_TEMP "ngt-updater-cargo"
        cargo clippy --manifest-path tools/ngt-updater/Cargo.toml --all-targets --all-features -- -D warnings
        if ($LASTEXITCODE -ne 0) { throw "Rust updater Clippy check failed." }
        cargo fmt --manifest-path tools/ngt-updater/Cargo.toml -- --check
        if ($LASTEXITCODE -ne 0) { throw "Rust updater formatting check failed." }
        cargo test --manifest-path tools/ngt-updater/Cargo.toml
        if ($LASTEXITCODE -ne 0) { throw "Rust updater tests failed." }
        $acceptanceTarget = Join-Path $env:RUNNER_TEMP "ngt-updater-acceptance-cargo"
        cargo build --release --features acceptance-api --manifest-path tools/ngt-updater/Cargo.toml --target-dir $acceptanceTarget
        if ($LASTEXITCODE -ne 0) { throw "Acceptance updater build failed." }
        $acceptanceOutput = Join-Path $env:RUNNER_TEMP "ngt-updater-acceptance"
        New-Item -ItemType Directory -Path $acceptanceOutput -Force | Out-Null
        Copy-Item -LiteralPath (Join-Path $acceptanceTarget "release\NGTUpdater.exe") `
          -Destination (Join-Path $acceptanceOutput "NGTUpdater.exe") -Force
    - name: Install pinned dependencies
      shell: powershell
      run: pnpm install --frozen-lockfile --config.node-linker=hoisted --config.package-import-method=copy
    - name: Run Windows updater coordination and safety regressions
      shell: powershell
      run: ./scripts/test-windows-studio-update-safety.ps1
    - name: Build Windows application from qualified source
      shell: powershell
      run: pnpm build
      env:
        DATABASE_URL: postgresql://ngt:ci-only@127.0.0.1:55432/ngt?schema=public
        AUTH_SECRET: ci-only-secret-for-studio-smoke
        AUTH_URL: http://127.0.0.1:3000
        AUTH_TRUST_HOST: "true"
        NEXT_TELEMETRY_DISABLED: "1"
        NODE_OPTIONS: --max-old-space-size=2048
    - name: Package and verify exact-commit Windows application
      shell: powershell
      run: |
        ./scripts/build-windows-studio-package.ps1
        ./scripts/test-windows-studio-package.ps1 -IntegrityOnly
        $version = (Get-Content -LiteralPath package.json -Raw | ConvertFrom-Json).version
        ./scripts/verify-windows-studio-release.ps1 -ReleaseRoot ".local/studio-package" -ExpectedVersion ("v" + $version) | Out-Null
    - name: Install pinned Inno Setup and build installer
      shell: powershell
      run: |
        choco install innosetup --version=6.7.1 --no-progress --yes
        if ($LASTEXITCODE -ne 0) { throw "Pinned Inno Setup installation failed." }
        $compiler = @(
          "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe",
          "C:\Program Files (x86)\Inno Setup 6\ISCC.exe",
          "C:\Program Files\Inno Setup 6\ISCC.exe"
        ) | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
        if (-not $compiler) { throw "Pinned Inno Setup compiler was not installed." }
        $compilerDirectory = [System.IO.Path]::GetDirectoryName([System.IO.Path]::GetFullPath($compiler))
        $installedInnoSetup = @(
          foreach ($registryRoot in @(
            "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall",
            "HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall"
          )) {
            if (Test-Path -LiteralPath $registryRoot) {
              Get-ChildItem -LiteralPath $registryRoot -ErrorAction SilentlyContinue | ForEach-Object {
                $entry = Get-ItemProperty -LiteralPath $_.PSPath -ErrorAction SilentlyContinue
                if ($entry.DisplayName -like "Inno Setup*" -and $entry.InstallLocation) {
                  $installDirectory = [System.IO.Path]::GetFullPath([string]$entry.InstallLocation).TrimEnd('\')
                  if ([string]::Equals($installDirectory, $compilerDirectory, [System.StringComparison]::OrdinalIgnoreCase)) {
                    $entry
                  }
                }
              }
            }
          }
        )
        if ($installedInnoSetup.Count -ne 1) { throw "Could not identify the Inno Setup installation that owns $compiler." }
        $compilerVersion = [string]$installedInnoSetup[0].DisplayVersion
        if ($compilerVersion -notlike "6.7.1*") { throw "Expected Inno Setup 6.7.1; found $compilerVersion." }
        ./scripts/build-windows-studio-installer.ps1
    - name: Generate candidate runtime archives and checksums
      shell: powershell
      run: ./scripts/prepare-windows-studio-update-assets.ps1
    - name: Create verified candidate asset manifest
      shell: powershell
      run: |
        $artifactDirectory = Join-Path $env:RUNNER_TEMP "ngt-windows-release-assets"
        New-Item -ItemType Directory -Path $artifactDirectory -Force | Out-Null
        Get-ChildItem -LiteralPath dist -File | Copy-Item -Destination $artifactDirectory
        node scripts/windows-studio-release.mjs manifest $artifactDirectory
        if ($LASTEXITCODE -ne 0) { throw "Candidate asset manifest creation failed." }
        node scripts/windows-studio-release.mjs verify-artifact $artifactDirectory
        if ($LASTEXITCODE -ne 0) { throw "Candidate asset verification failed." }
