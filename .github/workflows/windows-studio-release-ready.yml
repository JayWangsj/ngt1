name: Windows Studio Release Ready

on:
  workflow_dispatch:
    inputs:
      failure_probe:
        description: Isolated gate regression; never used by the formal release.
        type: choice
        required: true
        default: none
        options: [none, installer]

permissions:
  actions: read
  contents: read

concurrency:
  group: windows-studio-release-ready-${{ github.sha }}
  cancel-in-progress: false

jobs:
  qualify:
    name: Release Ready qualification
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false
      - name: Require master and exact-SHA Verify MVP before candidate build
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NGT_RELEASE_READY: "true"
        run: node scripts/windows-studio-release.mjs qualify-candidate
  build:
    name: Release Ready candidate build
    needs: qualify
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - uses: ./.github/actions/build-windows-studio-candidate
        env:
          NGT_RELEASE_READY: "true"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-candidate-${{ github.sha }}
          path: ${{ runner.temp }}/ngt-windows-release-assets/
          if-no-files-found: error
          retention-days: 3
      - uses: actions/upload-artifact@v4
        with:
          name: ngt-updater-acceptance-${{ github.sha }}
          path: ${{ runner.temp }}/ngt-updater-acceptance/NGTUpdater.exe
          if-no-files-found: error
          retention-days: 3

  installer-acceptance:
    name: Release Ready installer acceptance
    needs: build
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - uses: ./.github/actions/windows-studio-acceptance
        with:
          mode: ready
          acceptance: installer
          failure_probe: ${{ inputs.failure_probe }}

  online-update-acceptance:
    name: Release Ready online-update acceptance
    needs: build
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - uses: ./.github/actions/windows-studio-acceptance
        with:
          mode: ready
          acceptance: online-update

  backup-import-acceptance:
    name: Release Ready versioned backup import acceptance
    needs: [qualify, build]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: ngt
          POSTGRES_PASSWORD: ci-test-password
          POSTGRES_DB: ngt_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ngt -d ngt_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://ngt:ci-test-password@localhost:5432/ngt_test?schema=public
      AUTH_SECRET: ci-only-secret-for-backup-import-2026
      AUTH_URL: http://localhost:3000
      AUTH_TRUST_HOST: "true"
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm db:migrate
      - name: Exercise every supported versioned business backup format
        run: pnpm exec vitest run --config vitest.integration.config.ts tests/integration/business.test.ts -t "versioned data backup import"

  release-ready:
    name: Release Ready
    needs:
      [
        qualify,
        build,
        installer-acceptance,
        online-update-acceptance,
        backup-import-acceptance,
      ]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all isolated Windows acceptance jobs
        env:
          QUALIFY: ${{ needs.qualify.result }}
          BUILD: ${{ needs.build.result }}
          INSTALLER: ${{ needs.installer-acceptance.result }}
          ONLINE: ${{ needs.online-update-acceptance.result }}
          BACKUP_IMPORT: ${{ needs.backup-import-acceptance.result }}
        run: |
          for result in "$QUALIFY" "$BUILD" "$INSTALLER" "$ONLINE" "$BACKUP_IMPORT"; do
            if [[ "$result" != success ]]; then
              echo "::error::Release Ready requires every candidate build and acceptance job to succeed."
              exit 1
            fi
          done
