name: Verify MVP

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
    paths-ignore:
      - "**/*.md"

concurrency:
  group: verify-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify:
    concurrency:
      group: verify-main-${{ github.ref }}
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: ngt
          POSTGRES_PASSWORD: ci-test-password
          POSTGRES_DB: ngt_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ngt -d ngt_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://ngt:ci-test-password@localhost:5432/ngt_test?schema=public
      AUTH_SECRET: ci-only-secret-for-isolated-tests-2026
      AUTH_URL: http://localhost:3000
      AUTH_TRUST_HOST: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node --test tests/release/windows-studio-release.node-test.mjs tests/release/windows-studio-updater-test-release.node-test.mjs tests/release/windows-studio-business-probe.node-test.mjs tests/release/windows-studio-ready-gh.node-test.mjs
      - run: pnpm db:generate
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: node scripts/verify.mjs
      - name: Validate container build
        run: docker build --target runner -t ngt-mvp:ci .

  windows-studio-smoke:
    concurrency:
      group: verify-windows-smoke-${{ github.ref }}
      queue: max
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --config.node-linker=hoisted --config.package-import-method=copy
      - run: pnpm build
        env:
          DATABASE_URL: postgresql://ngt:ci-only@127.0.0.1:55432/ngt?schema=public
          AUTH_SECRET: ci-only-secret-for-studio-smoke
          AUTH_URL: http://127.0.0.1:3000
          AUTH_TRUST_HOST: "true"
          NEXT_TELEMETRY_DISABLED: "1"
          NODE_OPTIONS: --max-old-space-size=2048
      - shell: powershell
        run: ./scripts/build-windows-studio-package.ps1
      - shell: powershell
        run: ./scripts/test-windows-studio-package.ps1 -IntegrityOnly
      - shell: powershell
        run: ./scripts/test-windows-studio-diagnostics.ps1

  full-verification:
    needs: [verify, windows-studio-smoke]
    if: ${{ always() }}
    concurrency:
      group: verify-full-gate-${{ github.ref }}
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every release verification gate
        env:
          VERIFY_RESULT: ${{ needs.verify.result }}
          WINDOWS_SMOKE_RESULT: ${{ needs.windows-studio-smoke.result }}
        run: |
          if [[ "$VERIFY_RESULT" != "success" || "$WINDOWS_SMOKE_RESULT" != "success" ]]; then
            echo "::error::Full verification requires verify and windows-studio-smoke to both succeed."
            echo "verify=$VERIFY_RESULT windows-studio-smoke=$WINDOWS_SMOKE_RESULT"
            exit 1
          fi
          echo "Full verification passed for both required jobs."
