name: Publish Windows studio release

on:
  push:
    tags:
      - "v*"

permissions:
  actions: read
  contents: read

concurrency:
  group: windows-studio-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  qualify:
    name: Release qualification
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false
      - name: Validate tag and exact-SHA Verify MVP
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NGT_VERIFY_TIMEOUT_MINUTES: "20"
        run: node scripts/windows-studio-release.mjs qualify

  build:
    name: Rebuild and stage verified Windows Release
    needs: qualify
    runs-on: windows-2022
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - uses: ./.github/actions/build-windows-studio-candidate
      - name: Upload verified assets directly to a Draft Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: powershell
        run: |
          node scripts/windows-studio-release.mjs prepare-draft "$env:RUNNER_TEMP\ngt-windows-release-assets"
          if ($LASTEXITCODE -ne 0) { throw "Direct Draft Release upload failed." }
      - uses: actions/upload-artifact@v4
        with:
          name: ngt-updater-acceptance-${{ github.sha }}
          path: ${{ runner.temp }}/ngt-updater-acceptance/NGTUpdater.exe
          if-no-files-found: error
          retention-days: 3

  online-update-acceptance:
    name: Disposable Windows online-update acceptance
    needs: [qualify, build]
    runs-on: windows-2022
    timeout-minutes: 120
    permissions:
      # GitHub exposes draft releases only to users with push access.
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - uses: ./.github/actions/windows-studio-acceptance
        with:
          mode: draft
          acceptance: online-update

  production-updater-acceptance:
    name: Disposable Windows production updater and GitHub Release acceptance
    needs: [qualify, build]
    runs-on: windows-2022
    timeout-minutes: 120
    permissions:
      contents: write
    env:
      NGT_PRODUCTION_UPDATER_BASELINE: v2.0.21
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - uses: ./.github/actions/windows-studio-acceptance
        with:
          mode: draft
          acceptance: production-update

  installer-acceptance:
    name: Disposable Windows installer acceptance
    needs: [qualify, build]
    runs-on: windows-2022
    timeout-minutes: 45
    permissions:
      # GitHub exposes draft releases only to users with push access.
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - uses: ./.github/actions/windows-studio-acceptance
        with:
          mode: draft
          acceptance: installer

  manual-installer-acceptance:
    name: Disposable Windows manual upgrade and repair acceptance
    needs: [qualify, build]
    runs-on: windows-2022
    timeout-minutes: 120
    permissions:
      # GitHub exposes draft releases only to users with push access.
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - uses: ./.github/actions/windows-studio-acceptance
        with:
          mode: draft
          acceptance: manual-installer

  manual-v2020-acceptance:
    name: Disposable Windows v2.0.20 manual upgrade and repair acceptance
    needs: [qualify, build]
    runs-on: windows-2022
    timeout-minutes: 120
    permissions:
      contents: write
    env:
      NGT_MANUAL_UPGRADE_BASELINE: v2.0.20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - uses: ./.github/actions/windows-studio-acceptance
        with:
          mode: draft
          acceptance: manual-installer

  publish:
    name: Publish verified Release
    needs:
      [
        qualify,
        build,
        online-update-acceptance,
        production-updater-acceptance,
        installer-acceptance,
        manual-installer-acceptance,
        manual-v2020-acceptance,
      ]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false
      - name: Download and verify exact-SHA Draft Release assets
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/windows-studio-release.mjs download-draft release-assets
      - name: Re-verify artifact, Draft identity, and every Release asset before publishing
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/windows-studio-release.mjs publish release-assets

  release-metrics:
    name: Record Release run metrics
    needs:
      [
        qualify,
        build,
        online-update-acceptance,
        production-updater-acceptance,
        installer-acceptance,
        manual-installer-acceptance,
        manual-v2020-acceptance,
        publish,
      ]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false
      - name: Record queue, job, critical-path, and runner time
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/windows-studio-release-metrics.mjs

