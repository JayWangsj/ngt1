name: Publish Windows studio release

on:
  push:
    tags:
      - "v*"

permissions:
  actions: read
  contents: read

concurrency:
  group: windows-studio-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  qualify:
    name: Release qualification
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false
      - name: Validate tag and exact-SHA Verify MVP
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NGT_VERIFY_TIMEOUT_MINUTES: "20"
        run: node scripts/windows-studio-release.mjs qualify

  build:
    name: Rebuild and stage verified Windows Release
    needs: qualify
    runs-on: windows-2022
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - uses: ./.github/actions/build-windows-studio-candidate
      - name: Upload verified assets directly to a Draft Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: powershell
        run: |
          node scripts/windows-studio-release.mjs prepare-draft "$env:RUNNER_TEMP\ngt-windows-release-assets"
          if ($LASTEXITCODE -ne 0) { throw "Direct Draft Release upload failed." }
      - uses: actions/upload-artifact@v4
        with:
          name: ngt-updater-acceptance-${{ github.sha }}
          path: ${{ runner.temp }}/ngt-updater-acceptance/NGTUpdater.exe
          if-no-files-found: error
          retention-days: 3

  online-update-acceptance:
    name: Disposable Windows online-update acceptance
    needs: [qualify, build]
    runs-on: windows-2022
    timeout-minutes: 120
    permissions:
      # GitHub exposes draft releases only to users with push access.
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - uses: ./.github/actions/windows-studio-acceptance
        with:
          mode: draft
          acceptance: online-update

  production-updater-acceptance:
    name: Disposable Windows production updater and GitHub Release acceptance
    needs: [qualify, build]
    runs-on: windows-2022
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - uses: ./.github/actions/windows-studio-acceptance
        with:
          mode: draft
          acceptance: production-update

  installer-acceptance:
    name: Disposable Windows installer acceptance
    needs: [qualify, build]
    runs-on: windows-2022
    timeout-minutes: 45
    permissions:
      # GitHub exposes draft releases only to users with push access.
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - uses: ./.github/actions/windows-studio-acceptance
        with:
          mode: draft
          acceptance: installer

  backup-import-acceptance:
    name: Exact-SHA versioned backup import acceptance
    needs: qualify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: ngt
          POSTGRES_PASSWORD: ci-test-password
          POSTGRES_DB: ngt_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ngt -d ngt_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://ngt:ci-test-password@localhost:5432/ngt_test?schema=public
      AUTH_SECRET: ci-only-secret-for-backup-import-2026
      AUTH_URL: http://localhost:3000
      AUTH_TRUST_HOST: "true"
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm db:migrate
      - name: Exercise every supported versioned business backup format
        run: pnpm exec vitest run --config vitest.integration.config.ts tests/integration/business.test.ts -t "versioned data backup import"

  publish:
    name: Publish verified Release
    needs:
      [
        qualify,
        build,
        online-update-acceptance,
        production-updater-acceptance,
        installer-acceptance,
        backup-import-acceptance,
      ]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false
      - name: Download and verify exact-SHA Draft Release assets
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/windows-studio-release.mjs download-draft release-assets
      - name: Re-verify artifact, Draft identity, and every Release asset before publishing
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/windows-studio-release.mjs publish release-assets

  release-metrics:
    name: Record Release run metrics
    needs:
      [
        qualify,
        build,
        online-update-acceptance,
        production-updater-acceptance,
        installer-acceptance,
        backup-import-acceptance,
        publish,
      ]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false
      - name: Record queue, job, critical-path, and runner time
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/windows-studio-release-metrics.mjs
