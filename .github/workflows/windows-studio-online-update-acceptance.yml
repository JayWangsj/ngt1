name: Windows Studio Online Update Acceptance

on:
  pull_request:
    branches: [master]
    paths:
      - ".github/actions/build-windows-studio-candidate/**"
      - ".github/actions/windows-studio-acceptance/**"
      - ".github/workflows/windows-studio-online-update-acceptance.yml"
      - ".github/workflows/windows-studio-release-ready.yml"
      - ".cargo/config.toml"
      - "installer/windows-studio.iss"
      - "package.json"
      - "scripts/build-windows-studio-*.ps1"
      - "scripts/backup-windows-studio.ps1"
      - "scripts/install-windows-studio*.ps1"
      - "scripts/prepare-windows-studio-install.ps1"
      - "scripts/run-windows-studio-acceptance-as-standard-user.ps1"
      - "scripts/windows-studio-acceptance-coordinator.ps1"
      - "scripts/test-windows-studio-acceptance-coordinator.ps1"
      - "scripts/test-windows-studio-backup.ps1"
      - "scripts/test-windows-studio-install-coordination.ps1"
      - "scripts/test-windows-studio-package.ps1"
      - "scripts/test-windows-studio-baseline-json-encoding.ps1"
      - "scripts/test-windows-studio-installer.ps1"
      - "scripts/test-windows-studio-online-update-auth.ps1"
      - "scripts/windows-studio-online-update-auth.ps1"
      - "scripts/windows-studio-online-update-reconnect.ps1"
      - "scripts/windows-studio-ready-baseline.ps1"
      - "scripts/windows-studio-release-metadata.ps1"
      - "scripts/verify-windows-studio-runtime.ps1"
      - "scripts/test-windows-studio-update-safety.ps1"
      - "tests/release/windows-studio-release.node-test.mjs"
      - "tests/release/windows-studio-business-probe.node-test.mjs"
      - "tests/release/windows-studio-online-update-ui.mjs"
      - "scripts/studio-runtime.ps1"
      - "scripts/windows-studio-common.ps1"
      - "scripts/windows-studio-install-coordination.ps1"
      - "scripts/windows-studio-updater-acceptance-server.cjs"
      - "src/lib/studio-update.ts"
      - "tests/release/windows-studio-runtime-verifier.test.mjs"
      - "src/app/globals.css"
      - "src/components/system-update.tsx"
      - "src/components/update-state.tsx"
      - "src/lib/system-update-state.ts"
      - "src/messages/it.ts"
      - "src/messages/zh.ts"
      - "tools/ngt-updater/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-studio-online-update-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  online-update-acceptance:
    name: Isolated Windows silent online-update acceptance
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - name: Verify local and remote online-update authentication modes
        shell: powershell
        run: ./scripts/test-windows-studio-online-update-auth.ps1
      - uses: ./.github/actions/build-windows-studio-candidate
        env:
          NGT_RELEASE_READY: "true"
      - name: Upload exact-SHA offline installer candidate
        uses: actions/upload-artifact@v4
        with:
          name: ngt-studio-installer-candidate-${{ github.sha }}
          path: |
            ${{ runner.temp }}/ngt-windows-release-assets/ngt-studio-windows-setup-*.exe
            ${{ runner.temp }}/ngt-windows-release-assets/ngt-studio-windows-setup-*.exe.sha256
            ${{ runner.temp }}/ngt-windows-release-assets/release-manifest.json
          if-no-files-found: error
          retention-days: 7
      - name: Verify runtime gate rejects redirects and generic error pages
        shell: powershell
        run: node tests/release/windows-studio-runtime-verifier.test.mjs
      - name: Install the exact candidate as a disposable standard user
        shell: powershell
        env:
          NGT_RELEASE_READY: "true"
        run: |
          $candidate = Join-Path $env:RUNNER_TEMP "ngt-windows-release-assets"
          $destination = Join-Path $env:GITHUB_WORKSPACE "release-assets"
          New-Item -ItemType Directory -Path $destination -Force | Out-Null
          Get-ChildItem -LiteralPath $candidate -Force | Copy-Item -Destination $destination -Recurse -Force
          ./scripts/run-windows-studio-acceptance-as-standard-user.ps1 -Acceptance online-update
      - name: Summarize sanitized Windows acceptance failure
        if: failure()
        shell: powershell
        run: |
          $diagnosticPath = Join-Path $env:RUNNER_TEMP "ngt-acceptance-diagnostics-$($env:GITHUB_RUN_ID)-$($env:GITHUB_RUN_ATTEMPT)\acceptance-failure.json"
          $summaryPath = $env:GITHUB_STEP_SUMMARY
          if (-not (Test-Path -LiteralPath $diagnosticPath -PathType Leaf)) {
            Add-Content -LiteralPath $summaryPath -Encoding UTF8 -Value "No sanitized acceptance diagnostic was produced."
            exit 0
          }
          try {
            $report = Get-Content -LiteralPath $diagnosticPath -Raw | ConvertFrom-Json -ErrorAction Stop
            $lines = [System.Collections.Generic.List[string]]::new()
            $lines.Add("## Sanitized Windows acceptance failure")
            foreach ($name in @("acceptance", "childExitCode", "processExitCode", "timedOut")) {
              $value = $report.$name
              if ($null -ne $value -and [string]$value -ne "") { $lines.Add("- ${name}: $value") }
            }
            foreach ($section in @("primaryFailure", "childFailure")) {
              $failure = $report.$section
              if (-not $failure) { continue }
              foreach ($name in @("type", "message", "script", "line")) {
                $value = [string]$failure.$name
                if ([string]::IsNullOrWhiteSpace($value)) { continue }
                $value = [regex]::Replace($value, "[\r\n|\x60<>]", " ")
                if ($value.Length -gt 500) { $value = $value.Substring(0, 500) }
                $lines.Add("- ${section}.${name}: $value")
              }
            }
            foreach ($failure in $report.cleanupFailures) {
              $value = [regex]::Replace([string]$failure.step, "[\r\n|\x60<>]", " ")
              if ($value.Length -gt 200) { $value = $value.Substring(0, 200) }
              $lines.Add("- cleanupFailure: $value")
            }
            Add-Content -LiteralPath $summaryPath -Encoding UTF8 -Value ($lines -join [Environment]::NewLine)
          } catch {
            Add-Content -LiteralPath $summaryPath -Encoding UTF8 -Value "The sanitized acceptance diagnostic could not be summarized; see the uploaded diagnostic artifact."
          }
      - name: Upload sanitized Windows acceptance failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-studio-acceptance-diagnostics-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ngt-acceptance-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: warn
          retention-days: 7
